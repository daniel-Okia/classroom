name: CI
on: { push: { branches: [main, 'phase-*'] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: dev, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: classroom }
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U dev" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Prepare database (migrations + RLS + app role)
        run: |
          for f in packages/db/migrations/0*.sql packages/db/migrations/rls.sql; do psql -h 127.0.0.1 -p 54329 -U dev -d classroom -v ON_ERROR_STOP=1 -q -f $f; done
          psql -h 127.0.0.1 -p 54329 -U dev -d classroom -c "create role app_user login nosuperuser" -c "grant all on all tables in schema public to app_user"
      - run: pnpm test
      - run: pnpm --filter @classroom/web check
      - run: pnpm --filter @classroom/web build
      - run: node scripts/size-check.mjs
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
